name: Run V2 Spotify backlog batch

on:
  push:
    branches:
      - "ops/v2-spotify-backlog-live"

jobs:
  backlog:
    runs-on: ubuntu-latest
    steps:
      - name: Run one live backlog batch
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS               https://transmissionalbum.netlify.app/.netlify/functions/v2-spotify-backlog               -o /tmp/result.json; then
              echo "Production endpoint is live."
              cat /tmp/result.json
              exit 0
            fi
            echo "Backlog endpoint not ready yet, attempt $i/36"
            sleep 10
          done
          echo "Timed out waiting for production."
          exit 1
