<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c1010"><title>Transmission</title>
<style>
:root{color-scheme:dark;--bg:#0c1010;--panel:#151c1b;--ink:#e9ebe4;--muted:#9aaba5;--line:#2a3935;--green:#9de0ba;--yellow:#ebc585;--red:#e59a8e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button{font:inherit}.wrap{max-width:780px;margin:auto;padding:32px 22px 90px}
header{border-bottom:1px solid var(--line);padding-bottom:25px}h1{font-size:clamp(2.2rem,8vw,4rem);letter-spacing:-.07em;line-height:1;margin:0;font-weight:680}.eyebrow,.meta,.tabs button,.date,.score,.status{font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.02em}.eyebrow{color:var(--green);margin:0 0 14px}.intro{color:var(--muted);max-width:54ch;margin:12px 0 0}.status{color:var(--muted);margin:17px 0 0}.status.blocked{color:var(--red)}
.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin:30px 0 22px}.tabs button{padding:12px 15px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}.tabs button[aria-selected=true]{border-color:var(--green);color:var(--ink)}
h2{font-size:1.35rem;letter-spacing:-.035em;margin:0 0 5px}h3{font-size:1rem;margin:28px 0 7px}.hint{color:var(--muted);font-size:14px;margin:0 0 20px}.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid var(--line)}.artist{font-weight:600}.album{color:var(--muted)}.note{color:var(--green);font-size:12px}.date{white-space:nowrap;color:var(--muted);padding-top:3px}.group{margin-top:22px}.radar-row{padding:14px 0;border-bottom:1px solid var(--line)}.radar-head{display:flex;justify-content:space-between;gap:18px}.score{color:var(--green);white-space:nowrap}.score.mid{color:var(--yellow)}.meta{color:var(--muted);margin-top:5px}.reason{color:var(--muted);font-size:14px;margin:8px 0 0}.empty{color:var(--muted);padding:30px 0}.foot{color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:48px;padding-top:16px}a{color:var(--green)}
@media(max-width:540px){.wrap{padding:25px 17px 70px}.row{gap:9px}.date{font-size:10px}.tabs button{padding:10px}}
</style></head>
<body><div class="wrap">
<header><p class="eyebrow">A PERSONAL RELEASE RADAR</p><h1>Transmission</h1><p class="intro">The records you chose, the ones you want to hear, and new signals worth checking. Predictions stay predictions.</p><p class="status" id="status">Checking the signal…</p></header>
<nav class="tabs" aria-label="Sections"><button data-tab="picks" aria-selected="true">MY PICKS</button><button data-tab="listen" aria-selected="false">TO HEAR</button><button data-tab="radar" aria-selected="false">RADAR</button></nav>
<main id="content"></main><p class="foot">Your picks are unranked. Transmission's scores are guesses about unheard records, never your ratings.</p>
</div>
<script>
let state=null,tab='picks';const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('span');d.textContent=String(s??'');return d.innerHTML}
function date(s){if(!s)return '';const [y,m,d]=s.split('-').map(Number);if(!y||!m||!d)return '';return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function row(x,showDate=false){return `<div class="row"><div><span class="artist">${esc(x.artist)}</span><span class="album"> · ${esc(x.title)}</span>${x.note?` <span class="note">${esc(x.note)}</span>`:''}</div>${showDate&&x.date?`<span class="date">${esc(date(x.date))}</span>`:''}</div>`}
function key(x){return (x.artist+' '+(x.title||x.albumTitle)).toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]/g,'')}
function render(){if(!state)return;let c=$('content'),u=state.curated||{picks:[],toHear:[],anticipated:[]};
 if(tab==='picks'){c.innerHTML=`<h2>My 2026 albums</h2><p class="hint">${u.picks.length} favorites and contenders. No number one yet.</p>`+u.picks.map(x=>row(x)).join('');return}
 if(tab==='listen'){c.innerHTML='<h2>To hear</h2><p class="hint">Out now. Nothing here counts as a favorite yet.</p>'+u.toHear.map(x=>row(x)).join('')+'<h3>Coming up</h3>'+u.anticipated.map(x=>row(x,true)).join('');return}
 const named=new Set([...u.picks,...u.toHear,...u.anticipated].map(key));let today=new Date().toISOString().slice(0,10);
 let rs=(state.releases||[]).filter(x=>x.score>=60&&!named.has(key(x))&&x.releaseDate&&x.releaseDate>='2026-08-01');
 rs.sort((a,b)=>b.score-a.score||String(b.releaseDate).localeCompare(String(a.releaseDate)));rs=rs.slice(0,30);
 c.innerHTML='<h2>New signals</h2><p class="hint">Up to 30 unfamiliar records, strongest first. 60–74 is worth a look; 75+ is a strong prediction.</p>'+(rs.length?rs.map(x=>`<div class="radar-row"><div class="radar-head"><div><span class="artist">${esc(x.artist)}</span><span class="album"> · ${esc(x.albumTitle)}</span></div><span class="score ${x.score<75?'mid':''}">${esc(x.score)}%</span></div><div class="meta">${esc(x.releaseDate<=today?'OUT NOW':date(x.releaseDate))}${x.spotify?.status==='added'?' · SPOTIFY SYNCED':''}</div>${x.headline?`<p class="reason">${esc(x.headline)}</p>`:''}</div>`).join(''):'<p class="empty">No new signals in this range.</p>')}
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{tab=b.dataset.tab;for(const x of document.querySelectorAll('[data-tab]'))x.setAttribute('aria-selected',String(x===b));render()};
(async()=>{try{const r=await fetch('/.netlify/functions/v2-feed',{cache:'no-store'});if(!r.ok)throw Error('Feed unavailable');state=await r.json();const credit=(state.recentEvents||[]).some(x=>/credit balance is too low/i.test(x.detail||''));const s=$('status');s.textContent=credit?'Scoring paused: Anthropic credits exhausted. Your lists are still available.':state.lastRun?.ok===false?'Some discovery steps failed. Your lists are still available.':'Last scan: '+(state.lastRun?.at?new Date(state.lastRun.at).toLocaleString():'not yet run');s.classList.toggle('blocked',credit||state.lastRun?.ok===false);render()}catch(e){$('status').textContent=e.message;$('status').classList.add('blocked');$('content').innerHTML='<p class="empty">Could not load albums.</p>'}})();
</script></body></html>
