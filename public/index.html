<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transmission</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--surface:#15151a;--surface2:#111115;--line:#25252b;--text:#ececef;--muted:#777780;--dim:#4d4d55;--signal:#7fe7c4;--signal2:#2c4b42;--warm:#ff8c5a;--bad:#e87979}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Space Grotesk",sans-serif}.mono{font-family:"JetBrains Mono",monospace}
.wrap{max-width:760px;margin:0 auto;padding:38px 20px 80px}
header{display:flex;align-items:center;gap:18px;margin-bottom:24px}.scope{width:68px;height:68px;border-radius:50%;position:relative;overflow:hidden;background:#030504;border:1px solid var(--line);flex:none}
.scope:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle,transparent 0,transparent 10px,#1e2f2a 10px,#1e2f2a 11px)}
.scope:after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0deg,var(--signal) 36deg,transparent 36deg);opacity:.55;animation:sweep 5s linear infinite}
.cross:before,.cross:after{content:"";position:absolute;background:#1e2f2a;z-index:1}.cross:before{left:50%;top:4px;bottom:4px;width:1px}.cross:after{top:50%;left:4px;right:4px;height:1px}.blip{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--signal);box-shadow:0 0 8px var(--signal);z-index:2;left:42px;top:20px}
@keyframes sweep{to{transform:rotate(360deg)}}.word{font:700 2rem/1 "JetBrains Mono",monospace;letter-spacing:.075em;color:var(--signal);text-shadow:0 0 20px rgba(127,231,196,.28)}.sub{font:11px/1.4 "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.08em;margin-top:7px}
.statusbar{display:flex;gap:14px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:0 0 24px;color:var(--muted);font:11px "JetBrains Mono",monospace}.live{color:var(--signal)}.bad{color:var(--bad)}
.tabs{display:flex;gap:7px;margin-bottom:14px}.tab{border:1px solid var(--line);background:none;color:var(--muted);border-radius:4px;padding:6px 12px;font:11px "JetBrains Mono",monospace;letter-spacing:.07em;cursor:pointer}.tab.on{border-color:var(--signal);color:var(--signal)}
.summary{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 27px;padding:0 2px}.stat b{display:block;font:600 19px "JetBrains Mono",monospace;color:var(--text)}.stat span{font:10px "JetBrains Mono",monospace;color:var(--dim);letter-spacing:.07em}
.group{margin-top:30px}.datehead{position:sticky;top:0;background:rgba(11,11,13,.96);backdrop-filter:blur(8px);z-index:3;padding:11px 0 8px;display:flex;align-items:center;gap:10px}.datehead b{font:700 11px "JetBrains Mono",monospace;color:var(--signal);letter-spacing:.08em}.rule{height:1px;flex:1;background:var(--line)}.strength{margin-top:12px}.strengthhead{display:flex;align-items:center;gap:9px;padding:7px 0 2px;font:700 9px "JetBrains Mono",monospace;letter-spacing:.09em}.strengthhead:after{content:"";height:1px;flex:1;background:var(--line)}.strengthhead.strong{color:var(--signal)}.strengthhead.maybe{color:var(--warm)}.strengthhead.low{color:var(--dim)}
.card{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.art{width:64px;height:64px;border-radius:6px;object-fit:cover;background:var(--surface)}.ph{display:flex;align-items:center;justify-content:center;color:var(--dim);font:9px "JetBrains Mono",monospace}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font:500 13px/1.4 "JetBrains Mono",monospace}.album{color:var(--muted)}.score{font:500 12px "JetBrains Mono",monospace;color:var(--signal);white-space:nowrap}.meter{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-right:6px}.bar{width:3px;background:var(--signal2);border-radius:1px}.bar.on{background:var(--signal);box-shadow:0 0 5px rgba(127,231,196,.4)}.bar:nth-child(1){height:4px}.bar:nth-child(2){height:6px}.bar:nth-child(3){height:8px}.bar:nth-child(4){height:11px}.bar:nth-child(5){height:14px}
.meta{font:9px "JetBrains Mono",monospace;letter-spacing:.07em;color:var(--dim);margin-top:3px}.meta .full{color:var(--signal)}.meta .partial{color:var(--muted)}.meta .none{color:var(--warm)}
.headline{margin-top:7px;color:#c7c7cc;font-size:13px}.details{margin-top:8px;color:var(--muted);font-size:12px;display:none}.card.open .details{display:block}.more{margin-top:6px;border:0;background:none;padding:0;color:var(--dim);font:10px "JetBrains Mono",monospace;cursor:pointer}
.spotify{margin-top:7px;font:10px "JetBrains Mono",monospace}.spotify.added{color:var(--signal)}.spotify.error,.spotify.quarantined{color:var(--bad)}.spotify.not_found{color:var(--muted)}.spotify.pending{color:var(--warm)}
.tracks{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.chip{border:1px solid var(--line);padding:2px 5px;border-radius:3px;color:var(--muted);font:9px "JetBrains Mono",monospace}
.empty{padding:60px 0;color:var(--muted);text-align:center;font-family:"JetBrains Mono",monospace}.events{margin-top:42px;border-top:1px solid var(--line);padding-top:15px}.events summary{color:var(--dim);font:10px "JetBrains Mono",monospace;cursor:pointer}.event{font:10px "JetBrains Mono",monospace;color:var(--dim);padding:4px 0}.event strong{color:var(--muted);font-weight:400}
footer{margin-top:42px;font:10px "JetBrains Mono",monospace;color:var(--dim)}footer a{color:var(--dim)}
@media(max-width:520px){.wrap{padding:28px 15px 60px}.scope{width:58px;height:58px}.word{font-size:1.55rem}.card{grid-template-columns:52px 1fr}.art{width:52px;height:52px}.top{display:block}.score{margin-top:4px;display:block}.statusbar{align-items:flex-start;flex-direction:column;gap:4px}}
@media(prefers-reduced-motion:reduce){.scope:after{animation:none}}
</style>
</head>
<body><div class="wrap">
<header><div class="scope"><div class="cross"></div><div class="blip"></div></div><div><div class="word">TRANSMISSION</div><div class="sub">RELEASE RADAR / V2</div></div></header>
<div class="statusbar"><span id="engine">ENGINE // CONNECTING</span><span id="scan"></span></div>
<div class="tabs"><button class="tab on" id="up">UPCOMING</button><button class="tab" id="out">OUT NOW</button></div>
<div class="summary" id="summary"></div>
<div id="feed"><div class="empty">tuning in…</div></div>
<details class="events"><summary>ENGINE LOG</summary><div id="events"></div></details>
<footer><a href="/legacy.html">legacy interface</a></footer>
</div>
<script>
const $=id=>document.getElementById(id);let data=null,mode="upcoming";
function esc(v){const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}
function day(s){if(!s)return"DATE UNKNOWN";const d=new Date(s+"T12:00:00");const n=new Date();n.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const diff=Math.round((x-n)/86400000);if(diff===0)return"TODAY";if(diff===1)return"TOMORROW";if(diff>-1&&diff<7)return d.toLocaleDateString("en-US",{weekday:"long"}).toUpperCase();return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:d.getFullYear()!==n.getFullYear()?"numeric":undefined}).toUpperCase()}
function bars(score){const n=Math.max(0,Math.min(5,Math.round((score||0)/20)));return '<span class="meter">'+[1,2,3,4,5].map(i=>'<i class="bar'+(i<=n?' on':'')+'"></i>').join("")+'</span>'}
function spotify(r){if(mode!=="released")return"";const s=r.spotify?.status||"not_needed";const labels={added:"SPOTIFY // SYNCED",pending:"SPOTIFY // QUEUED",error:"SPOTIFY // RETRYING",quarantined:"SPOTIFY // NEEDS ATTENTION",not_found:"SPOTIFY // NOT FOUND",not_needed:"SPOTIFY // BELOW ADD THRESHOLD"};return '<div class="spotify '+esc(s)+'">'+esc(labels[s]||s.toUpperCase())+'</div>'}
function card(r){const art=r.art?.url?'<img class="art" src="'+esc(r.art.url)+'" alt="">':'<div class="art ph">NO ART</div>';const evidence=["full","partial","none"].includes(r.evidenceLevel)?r.evidenceLevel:"none";const tracks=mode==="released"&&r.standoutTracks?.length?'<div class="tracks">'+r.standoutTracks.map(t=>'<span class="chip">'+esc(t)+'</span>').join("")+'</div>':"";return '<div class="card">'+art+'<div><div class="top"><div class="title">'+esc(r.artist)+' <span class="album">— '+esc(r.albumTitle)+'</span></div><div class="score">'+bars(r.score)+esc(r.score??"?")+'%</div></div><div class="meta"><span class="'+evidence+'">'+evidence.toUpperCase()+' SIGNAL</span> // '+esc(day(r.releaseDate))+'</div><div class="headline">'+esc(r.headline||"")+'</div>'+spotify(r)+tracks+(r.reasoning?'<button class="more">+ WHY</button><div class="details">'+esc(r.reasoning)+'</div>':'')+'</div></div>'}
function strengthBand(score){const s=Number(score)||0;if(s>=70)return{key:"strong",label:"STRONG SIGNAL // 70–100"};if(s>=40)return{key:"maybe",label:"MAYBE // 40–69"};return{key:"low",label:"LOW SIGNAL // 0–39"}}
function releasedDay(rs){const bands={strong:[],maybe:[],low:[]};for(const r of rs){bands[strengthBand(r.score).key].push(r)}for(const a of Object.values(bands))a.sort((x,y)=>(y.score||0)-(x.score||0));return["strong","maybe","low"].filter(k=>bands[k].length).map(k=>{const b=strengthBand(k==="strong"?70:k==="maybe"?40:0);return'<div class="strength"><div class="strengthhead '+k+'">'+esc(b.label)+'</div>'+bands[k].map(card).join("")+'</div>'}).join("")}
function render(){if(!data)return;const list=data.releases.filter(r=>mode==="upcoming"?r.lifecycle==="upcoming":r.lifecycle==="released");list.sort((a,b)=>mode==="upcoming"?(a.releaseDate||"9999").localeCompare(b.releaseDate||"9999"):(b.releaseDate||"").localeCompare(a.releaseDate||""));const hi=list.filter(r=>(r.score||0)>=70).length;const queue=list.filter(r=>r.spotify?.status==="error"||r.spotify?.status==="pending").length;$("summary").innerHTML='<div class="stat"><b>'+list.length+'</b><span>'+ (mode==="upcoming"?"ON RADAR":"RECENT RELEASES")+'</span></div><div class="stat"><b>'+hi+'</b><span>70%+ SIGNALS</span></div>'+(mode==="released"?'<div class="stat"><b>'+queue+'</b><span>SPOTIFY QUEUE</span></div>':'');if(!list.length){$("feed").innerHTML='<div class="empty">nothing on this channel</div>';return}const groups={};for(const r of list){const k=day(r.releaseDate);(groups[k]=groups[k]||[]).push(r)}$("feed").innerHTML=Object.entries(groups).map(([k,rs])=>'<div class="group"><div class="datehead"><b>'+esc(k)+'</b><span class="rule"></span></div>'+(mode==="released"?releasedDay(rs):rs.sort((a,b)=>(b.score||0)-(a.score||0)).map(card).join(""))+'</div>').join("");document.querySelectorAll(".more").forEach(b=>b.onclick=()=>{const c=b.closest(".card");c.classList.toggle("open");b.textContent=c.classList.contains("open")?"− WHY":"+ WHY"})}
async function load(){try{const r=await fetch("/.netlify/functions/v2-feed",{cache:"no-store"});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||"feed failed");data=d;const lr=d.lastRun;$("engine").textContent=lr?.ok===false?"ENGINE // ERROR":"ENGINE // ONLINE";$("engine").className=lr?.ok===false?"bad":"live";$("scan").textContent=lr?.at?"LAST SCAN // "+new Date(lr.at).toLocaleString():"NOT SCANNED YET";$("events").innerHTML=(d.recentEvents||[]).map(e=>'<div class="event"><strong>'+esc(e.type.toUpperCase())+'</strong> // '+esc(e.text)+'</div>').join("")||'<div class="event">No V2 events yet.</div>';render()}catch(e){$("engine").textContent="ENGINE // OFFLINE";$("engine").className="bad";$("feed").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$("up").onclick=()=>{mode="upcoming";$("up").classList.add("on");$("out").classList.remove("on");render()};$("out").onclick=()=>{mode="released";$("out").classList.add("on");$("up").classList.remove("on");render()};load();
</script></body></html>
