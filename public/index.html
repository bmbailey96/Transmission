<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transmission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #15151a;
    --hairline: #232328;
    --text: #ececef;
    --muted: #75757d;
    --dim: #4c4c52;
    --signal: #7fe7c4;
    --signal-dim: #2c4b42;
    --warm: #ff8c5a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    line-height: 1.55;
  }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .wordmark {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.12em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.6);
    animation: pulse 2.4s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(127, 231, 196, 0.45); }
    70%  { box-shadow: 0 0 0 7px rgba(127, 231, 196, 0); }
    100% { box-shadow: 0 0 0 0 rgba(127, 231, 196, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; }
  }

  .subhead {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 24px;
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 36px;
  }

  .sort-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    background: none;
    border: 1px solid var(--hairline);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
  }

  .sort-btn.active {
    border-color: var(--signal);
    color: var(--signal);
  }

  .sort-btn:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  .datehead {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 44px 0 16px;
  }

  .datehead:first-of-type { margin-top: 0; }

  .datehead .label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: var(--signal);
    white-space: nowrap;
  }

  .datehead .label.future { color: var(--text); }

  .datehead .rule {
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .card {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--hairline);
  }

  .card:last-child { border-bottom: none; }

  .art {
    width: 64px;
    height: 64px;
    border-radius: 6px;
    flex-shrink: 0;
    object-fit: cover;
    background: var(--surface);
  }

  .art.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-size: 0.6rem;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }

  .info { flex: 1; min-width: 0; }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .title {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 500;
    font-size: 0.92rem;
  }

  .title .artist { color: var(--text); }
  .title .sep { color: var(--dim); margin: 0 4px; }
  .title .album { color: var(--muted); }

  .score-wrap {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }

  .score-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--signal);
    width: 30px;
    text-align: right;
  }

  .score-bar {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--signal-dim);
    overflow: hidden;
  }

  .score-bar > div {
    height: 100%;
    background: var(--signal);
  }

  .inline-date {
    font-size: 0.72rem;
    color: var(--dim);
    margin-top: 2px;
  }

  .headline-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-top: 6px;
  }

  .headline {
    font-size: 0.88rem;
    color: #c4c4c9;
  }

  .toggle-reason {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--hairline);
    color: var(--dim);
    width: 20px;
    height: 20px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .toggle-reason:hover { color: var(--muted); border-color: var(--muted); }

  .toggle-reason:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 1px;
  }

  .reason-extra {
    margin-top: 8px;
    font-size: 0.88rem;
    color: #9a9aa1;
  }

  .reason-extra[hidden] { display: none; }

  .reveal {
    margin-top: 14px;
  }

  .reveal summary {
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    list-style: none;
  }

  .reveal summary::-webkit-details-marker { display: none; }

  .reveal summary::before {
    content: '+ ';
    color: var(--dim);
  }

  .reveal[open] summary::before {
    content: '\2212 ';
  }

  .reveal .card {
    opacity: 0.72;
  }

  .empty, .error {
    color: var(--muted);
    font-size: 0.92rem;
    padding: 60px 0;
    text-align: center;
  }

  .error { color: var(--warm); }

  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--hairline);
  }

  footer a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--dim);
    text-decoration: none;
  }

  footer a:hover { color: var(--muted); }

  @media (max-width: 480px) {
    .art { width: 52px; height: 52px; }
    .title-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark"><span class="pulse"></span>TRANSMISSION</div>
  </header>
  <p class="subhead">What's coming, in order. Strong matches up front, everything else one tap away.</p>

  <div class="controls">
    <button id="sort-date" class="sort-btn active mono" aria-pressed="true">BY DATE</button>
    <button id="sort-score" class="sort-btn mono" aria-pressed="false">BY SCORE</button>
  </div>

  <div id="feed">
    <p class="empty mono">tuning in&hellip;</p>
  </div>

  <footer>
    <a href="/.netlify/functions/test-discovery">discovery test &rarr;</a>
  </footer>
</div>

<script>
const HIGH_THRESHOLD = 50;

let allUpcoming = [];
let mode = 'date'; // 'date' | 'score'
let cardCounter = 0;

function dayLabel(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(dateStr + 'T00:00:00');
  const diffDays = Math.round((d - today) / 86400000);

  if (diffDays === 0) return { text: 'TODAY', future: false };
  if (diffDays === 1) return { text: 'TOMORROW', future: false };
  if (diffDays > 1 && diffDays < 7) {
    return { text: d.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase(), future: true };
  }
  return {
    text: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase(),
    future: true,
  };
}

function shortDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderCard(r) {
  const id = 'reason-' + (cardCounter++);
  const artHtml = r.art && r.art.url
    ? `<img class="art" src="${escapeHtml(r.art.url)}" alt="">`
    : `<div class="art placeholder">no art</div>`;

  const headlineText = r.headline || r.reasoning || '';
  const hasExtra = !!(r.headline && r.reasoning && r.reasoning.trim() !== r.headline.trim());

  const dateLine = mode === 'score' && r.releaseDate
    ? `<div class="inline-date mono">${shortDate(r.releaseDate)}</div>`
    : '';

  return `
    <div class="card">
      ${artHtml}
      <div class="info">
        <div class="title-row">
          <div class="title"><span class="artist">${escapeHtml(r.artist)}</span><span class="sep">&mdash;</span><span class="album">${escapeHtml(r.albumTitle)}</span></div>
          <div class="score-wrap">
            <div class="score-bar"><div style="width:${r.score}%"></div></div>
            <span class="score-num mono">${r.score}%</span>
          </div>
        </div>
        ${dateLine}
        <div class="headline-row">
          <div class="headline">${escapeHtml(headlineText)}</div>
          ${hasExtra ? `<button class="toggle-reason" data-target="${id}" aria-expanded="false" aria-label="show more">+</button>` : ''}
        </div>
        ${hasExtra ? `<div class="reason-extra" id="${id}" hidden>${escapeHtml(r.reasoning)}</div>` : ''}
      </div>
    </div>
  `;
}

function renderDateMode(releases) {
  const byDate = {};
  releases.forEach((r) => {
    (byDate[r.releaseDate] = byDate[r.releaseDate] || []).push(r);
  });
  const dates = Object.keys(byDate).sort();

  return dates.map((d) => {
    const sorted = [...byDate[d]].sort((a, b) => b.score - a.score);
    const high = sorted.filter((r) => r.score >= HIGH_THRESHOLD);
    const low = sorted.filter((r) => r.score < HIGH_THRESHOLD);
    const label = dayLabel(d);

    let html = `
      <div class="datehead">
        <span class="label ${label.future ? 'future' : ''} mono">${label.text}</span>
        <span class="rule"></span>
      </div>
      ${high.map(renderCard).join('')}
    `;

    if (low.length) {
      html += `
        <details class="reveal">
          <summary>${low.length} more releasing this day</summary>
          ${low.map(renderCard).join('')}
        </details>
      `;
    }
    return html;
  }).join('');
}

function renderScoreMode(releases) {
  const sorted = [...releases].sort((a, b) => b.score - a.score);
  const high = sorted.filter((r) => r.score >= HIGH_THRESHOLD);
  const low = sorted.filter((r) => r.score < HIGH_THRESHOLD);

  let html = high.map(renderCard).join('');

  if (low.length) {
    html += `
      <details class="reveal">
        <summary>${low.length} more below ${HIGH_THRESHOLD}%</summary>
        ${low.map(renderCard).join('')}
      </details>
    `;
  }
  return html;
}

function renderFeed() {
  cardCounter = 0;
  const feed = document.getElementById('feed');
  if (!allUpcoming.length) {
    feed.innerHTML = '<p class="empty mono">Nothing scored yet for what\'s ahead. The pipeline runs hourly, check back soon.</p>';
    return;
  }
  feed.innerHTML = mode === 'date' ? renderDateMode(allUpcoming) : renderScoreMode(allUpcoming);
}

function setMode(next) {
  if (mode === next) return;
  mode = next;
  document.getElementById('sort-date').classList.toggle('active', mode === 'date');
  document.getElementById('sort-score').classList.toggle('active', mode === 'score');
  document.getElementById('sort-date').setAttribute('aria-pressed', mode === 'date');
  document.getElementById('sort-score').setAttribute('aria-pressed', mode === 'score');
  renderFeed();
}

document.getElementById('sort-date').addEventListener('click', () => setMode('date'));
document.getElementById('sort-score').addEventListener('click', () => setMode('score'));

document.getElementById('feed').addEventListener('click', (e) => {
  const btn = e.target.closest('.toggle-reason');
  if (!btn) return;
  const target = document.getElementById(btn.dataset.target);
  if (!target) return;
  const isHidden = target.hasAttribute('hidden');
  if (isHidden) {
    target.removeAttribute('hidden');
    btn.textContent = '\u2212';
    btn.setAttribute('aria-expanded', 'true');
  } else {
    target.setAttribute('hidden', '');
    btn.textContent = '+';
    btn.setAttribute('aria-expanded', 'false');
  }
});

async function load() {
  const feed = document.getElementById('feed');
  try {
    const res = await fetch('/.netlify/functions/releases');
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const todayStr = new Date().toISOString().slice(0, 10);
    const scored = (data.releases || []).filter((r) => typeof r.score === 'number' && r.releaseDate);
    allUpcoming = scored.filter((r) => r.releaseDate >= todayStr);

    renderFeed();
  } catch (err) {
    feed.innerHTML = '<p class="error mono">Couldn\'t load the feed: ' + escapeHtml(err.message) + '</p>';
  }
}

load();
</script>
</body>
</html>
