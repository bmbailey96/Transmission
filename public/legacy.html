<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transmission</title>
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transmission">
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #15151a;
    --hairline: #232328;
    --text: #ececef;
    --muted: #75757d;
    --dim: #4c4c52;
    --signal: #7fe7c4;
    --signal-dim: #2c4b42;
    --scope-dim: #1e2f2a;
    --warm: #ff8c5a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    line-height: 1.55;
  }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  .console {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 0 14px;
  }

  .console::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.16) 3px);
    pointer-events: none;
    opacity: 0.45;
  }

  .console::after {
    content: '';
    position: absolute;
    inset: -10px;
    background: radial-gradient(ellipse at 28% 45%, rgba(127,231,196,0.1), rgba(127,231,196,0.03) 45%, transparent 75%);
    pointer-events: none;
    animation: panel-hum 7s linear infinite;
  }

  @keyframes panel-hum {
    0%, 100% { opacity: 1; }
    6% { opacity: 0.97; } 7% { opacity: 1; }
    24% { opacity: 0.985; } 25% { opacity: 1; }
    44% { opacity: 0.96; } 46% { opacity: 1; }
    61% { opacity: 0.99; }
    79% { opacity: 0.975; } 80% { opacity: 1; }
  }

  .scope {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    background: #030504;
    border: 1px solid var(--hairline);
    overflow: hidden;
    z-index: 1;
  }

  .scope .rings {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, transparent 0, transparent 10px, var(--scope-dim) 10px, var(--scope-dim) 11px);
    opacity: 0.9;
  }

  .scope .crosshair { position: absolute; inset: 0; }
  .scope .crosshair::before, .scope .crosshair::after { content: ''; position: absolute; background: var(--scope-dim); }
  .scope .crosshair::before { left: 50%; top: 3px; bottom: 3px; width: 1px; margin-left: -0.5px; }
  .scope .crosshair::after { top: 50%; left: 3px; right: 3px; height: 1px; margin-top: -0.5px; }

  .scope .sweep {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, var(--signal) 42deg, transparent 42deg, transparent 360deg);
    opacity: 0.55;
    animation: sweep 5s linear infinite;
  }

  @keyframes sweep { to { transform: rotate(360deg); } }

  .scope .blip { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--signal); }
  .scope .blip.b1 { top: 18px; left: 47px; }
  .scope .blip.b2 { top: 41px; left: 24px; width: 4px; height: 4px; }
  .scope .blip.b3 { top: 31px; left: 36px; width: 2px; height: 2px; opacity: 0.7; }
  .scope .blip.live { animation: blippulse 4s ease-in-out infinite; }

  @keyframes blippulse { 0%, 70%, 100% { opacity: 0.7; } 80% { opacity: 1; box-shadow: 0 0 4px var(--signal); } }

  .wordmark-big {
    position: relative;
    z-index: 1;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 700;
    font-size: 2.1rem;
    letter-spacing: 0.07em;
    color: var(--signal);
    line-height: 1;
    animation: glow-hum 5.4s linear infinite;
  }

  @keyframes glow-hum {
    0%, 100% { text-shadow: 0 0 10px rgba(127,231,196,0.5), 0 0 28px rgba(127,231,196,0.32), 0 0 52px rgba(127,231,196,0.14); }
    18% { text-shadow: 0 0 8px rgba(127,231,196,0.4), 0 0 22px rgba(127,231,196,0.26), 0 0 42px rgba(127,231,196,0.1); }
    19% { text-shadow: 0 0 10px rgba(127,231,196,0.5), 0 0 28px rgba(127,231,196,0.32), 0 0 52px rgba(127,231,196,0.14); }
    52% { text-shadow: 0 0 11px rgba(127,231,196,0.55), 0 0 32px rgba(127,231,196,0.36), 0 0 58px rgba(127,231,196,0.16); }
    67% { text-shadow: 0 0 8px rgba(127,231,196,0.38), 0 0 21px rgba(127,231,196,0.24), 0 0 40px rgba(127,231,196,0.09); }
    68% { text-shadow: 0 0 10px rgba(127,231,196,0.5), 0 0 28px rgba(127,231,196,0.32), 0 0 52px rgba(127,231,196,0.14); }
  }

  .yearstrip {
    position: relative;
    height: 44px;
    margin: 0 0 30px;
  }

  .yearstrip .track {
    position: absolute;
    top: 24px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--scope-dim);
  }

  .yearstrip .mark {
    position: absolute;
    top: 32px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.62rem;
    color: var(--dim);
    letter-spacing: 0.06em;
  }

  .yearstrip .mark.now { color: var(--warm); }

  .strip-blip {
    position: absolute;
    top: 24px;
    border-radius: 50%;
    background: var(--signal);
    animation: stripblink 3.6s ease-in-out infinite;
    animation-delay: var(--d, 0s);
  }

  .strip-blip::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    border: 1px solid var(--signal);
    opacity: 0;
    animation: strip-ring 3.6s ease-out infinite;
    animation-delay: var(--d, 0s);
  }

  @keyframes stripblink { 0%, 60%, 100% { opacity: 0.45; } 75% { opacity: 1; } }

  @keyframes strip-ring {
    0% { transform: scale(1); opacity: 0; }
    20% { opacity: 0.3; }
    75% { transform: scale(2.0); opacity: 0; }
    100% { opacity: 0; }
  }

  .strip-blip.bright { box-shadow: 0 0 9px var(--signal), 0 0 18px rgba(127,231,196,0.5); }
  .strip-blip.bright::after { border-width: 1.5px; animation-name: strip-ring-bright; }

  @keyframes strip-ring-bright {
    0% { transform: scale(1); opacity: 0; }
    20% { opacity: 0.5; }
    75% { transform: scale(2.8); opacity: 0; }
    100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scope .sweep,
    .scope .blip.live,
    .strip-blip,
    .strip-blip::after,
    .console::after,
    .wordmark-big {
      animation: none !important;
    }
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 36px;
  }

  .sort-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    background: none;
    border: 1px solid var(--hairline);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
  }

  .sort-btn.active {
    border-color: var(--signal);
    color: var(--signal);
  }

  .sort-btn:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  .new-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: var(--warm);
    border: 1px solid var(--warm);
    border-radius: 3px;
    padding: 1px 5px;
    flex-shrink: 0;
  }

  .evidence-line {
    font-size: 0.66rem;
    letter-spacing: 0.07em;
    margin: 3px 0 7px;
  }

  .evidence-line.full { color: var(--signal); }
  .evidence-line.partial { color: var(--muted); }
  .evidence-line.none { color: var(--warm); }

  .tracks-line {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 7px;
  }

  .track-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.03em;
    color: var(--muted);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 2px 6px;
  }

  .view-tabs {
    margin-bottom: 22px;
  }

  .view-tabs .sort-btn {
    font-size: 0.76rem;
    padding: 6px 14px;
  }

  .day-group {
    margin-top: 40px;
  }

  .day-group:first-of-type { margin-top: 0; }

  .datehead {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: 10px;
  }

  .datehead .label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: var(--signal);
    white-space: nowrap;
  }

  .datehead .label.future { color: var(--text); }

  .datehead .rule {
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .score-pin {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: 10px;
    margin-bottom: 4px;
  }

  .score-pin[hidden] { display: none; }

  .hide-control {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 3px 9px;
    cursor: pointer;
    white-space: nowrap;
  }

  .hide-control:hover { color: var(--text); border-color: var(--muted); }
  .hide-control:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
  .hide-control[hidden] { display: none; }

  .card {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--hairline);
  }

  .day-group > .card:last-child,
  .reveal-cards > .card:last-child {
    border-bottom: none;
  }

  .art {
    width: 64px;
    height: 64px;
    border-radius: 6px;
    flex-shrink: 0;
    object-fit: cover;
    background: var(--surface);
  }

  .art.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-size: 0.6rem;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }

  .info { flex: 1; min-width: 0; }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .title {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 500;
    font-size: 0.92rem;
  }

  .title .artist { color: var(--text); }
  .title .sep { color: var(--dim); margin: 0 4px; }
  .title .album { color: var(--muted); }

  .score-wrap {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }

  .score-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--signal);
    width: 30px;
    text-align: right;
  }

  .meter {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 17px;
    flex-shrink: 0;
  }

  .meter .bar {
    width: 4px;
    border-radius: 1px;
    background: var(--signal-dim);
  }

  .meter .bar.lit {
    background: var(--signal);
    box-shadow: 0 0 4px rgba(127, 231, 196, 0.55), 0 0 8px rgba(127, 231, 196, 0.25);
  }

  .meter .bar:nth-child(1) { height: 5px; }
  .meter .bar:nth-child(2) { height: 8px; }
  .meter .bar:nth-child(3) { height: 11px; }
  .meter .bar:nth-child(4) { height: 14px; }
  .meter .bar:nth-child(5) { height: 17px; }

  .inline-date {
    font-size: 0.72rem;
    color: var(--dim);
    margin-top: 2px;
  }

  .headline-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-top: 6px;
  }

  .headline {
    font-size: 0.88rem;
    color: #c4c4c9;
  }

  .toggle-reason {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--hairline);
    color: var(--dim);
    width: 20px;
    height: 20px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .toggle-reason:hover { color: var(--muted); border-color: var(--muted); }

  .toggle-reason:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 1px;
  }

  .reveal-toggle {
    display: block;
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-align: left;
  }

  .reveal-toggle::before { content: '+ '; color: var(--dim); }
  .reveal-toggle:hover { color: var(--text); }
  .reveal-toggle:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .reveal-toggle[hidden] { display: none; }

  .reveal {
    scroll-margin-top: 56px;
  }

  .reveal-cards {
    margin-top: 14px;
    padding-left: 14px;
    border-left: 2px solid var(--hairline);
  }

  .reveal-cards .card {
    opacity: 0.72;
  }

  .reveal-cards[hidden] { display: none; }

  .empty, .error {
    color: var(--muted);
    font-size: 0.92rem;
    padding: 60px 0;
    text-align: center;
  }

  .error { color: var(--warm); }

  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--hairline);
  }

  footer a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--dim);
    text-decoration: none;
  }

  footer a:hover { color: var(--muted); }

  @media (max-width: 480px) {
    .art { width: 52px; height: 52px; }
    .title-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="console">
    <div class="scope">
      <div class="rings"></div>
      <div class="crosshair"></div>
      <div class="sweep"></div>
      <div class="blip b1"></div>
      <div class="blip b2 live"></div>
      <div class="blip b3"></div>
    </div>
    <div class="wordmark-big">TRANSMISSION</div>
  </header>

  <div class="controls view-tabs">
    <button id="view-upcoming" class="sort-btn active mono" aria-pressed="true">UPCOMING</button>
    <button id="view-released" class="sort-btn mono" aria-pressed="false">ALREADY OUT</button>
  </div>

  <div class="yearstrip" id="yearstrip"></div>

  <div class="controls">
    <button id="sort-date" class="sort-btn active mono" aria-pressed="true">BY DATE</button>
    <button id="sort-score" class="sort-btn mono" aria-pressed="false">BY SCORE</button>
    <button id="filter-recent" class="sort-btn mono" aria-pressed="false" style="margin-left:auto;">RECENT</button>
  </div>

  <div id="feed">
    <p class="empty mono">tuning in&hellip;</p>
  </div>

  <footer>
    <a href="/.netlify/functions/test-discovery">discovery test &rarr;</a>
  </footer>
</div>

<script>
const HIGH_THRESHOLD = 50;
const SNIPPET_MAX_CHARS = 60;
const STRIP_BRIGHT_THRESHOLD = 65;
const RECENT_DAYS = 14;

let allUpcoming = [];
let allReleased = [];
let view = 'upcoming'; // 'upcoming' | 'released'
let mode = 'date'; // 'date' | 'score'
let recentOnly = false;
let cardCounter = 0;
let cardTextMap = {};

function dayLabel(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(dateStr + 'T00:00:00');
  const diffDays = Math.round((d - today) / 86400000);

  if (diffDays === 0) return { text: 'TODAY', future: false };
  if (diffDays === 1) return { text: 'TOMORROW', future: false };
  if (diffDays > 1 && diffDays < 7) {
    return { text: d.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase(), future: true };
  }
  return {
    text: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase(),
    future: true,
  };
}

function shortDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function fullTextFor(r) {
  if (r.headline && r.reasoning && r.reasoning.trim() !== r.headline.trim()) {
    return r.headline.trim() + ' ' + r.reasoning.trim();
  }
  return (r.headline || r.reasoning || '').trim();
}

function truncateText(text, maxChars) {
  if (!text || text.length <= maxChars) return { snippet: text, truncated: false };
  let cut = text.slice(0, maxChars);
  const lastSpace = cut.lastIndexOf(' ');
  if (lastSpace > 20) cut = cut.slice(0, lastSpace);
  return { snippet: cut.trim() + '\u2026', truncated: true };
}

function isRecentlyAnnounced(r) {
  if (!r.announcedAt) return false;
  const announced = new Date(r.announcedAt).getTime();
  if (Number.isNaN(announced)) return false;
  return announced >= Date.now() - RECENT_DAYS * 86400000;
}

function visibleReleases() {
  return recentOnly ? allUpcoming.filter(isRecentlyAnnounced) : allUpcoming;
}

function litBars(score) {
  return Math.max(0, Math.min(5, Math.round((score / 100) * 5)));
}

function evidenceLabel(level) {
  if (level === 'full') return 'FULL SIGNAL';
  if (level === 'partial') return 'PARTIAL SIGNAL';
  return 'NO SIGNAL';
}

function renderTracksLine(r) {
  if (r.category !== 'already-released' || !Array.isArray(r.standoutTracks) || !r.standoutTracks.length) return '';
  return `<div class="tracks-line">${r.standoutTracks.map((t) => `<span class="track-chip">${escapeHtml(t)}</span>`).join('')}</div>`;
}

function renderCard(r) {
  const id = 'text-' + (cardCounter++);
  const artHtml = r.art && r.art.url
    ? `<img class="art" src="${escapeHtml(r.art.url)}" alt="">`
    : `<div class="art placeholder">no art</div>`;

  const full = fullTextFor(r);
  const { snippet, truncated } = truncateText(full, SNIPPET_MAX_CHARS);
  cardTextMap[id] = { snippet, full };

  const evidence = ['full', 'partial', 'none'].includes(r.evidenceLevel) ? r.evidenceLevel : 'none';

  const dateLine = mode === 'score' && r.releaseDate
    ? `<div class="inline-date mono">${shortDate(r.releaseDate)}</div>`
    : '';

  return `
    <div class="card">
      ${artHtml}
      <div class="info">
        <div class="title-row">
          <div class="title"><span class="artist">${escapeHtml(r.artist)}</span><span class="sep">&mdash;</span><span class="album">${escapeHtml(r.albumTitle)}</span></div>
          <div class="score-wrap">
            ${isRecentlyAnnounced(r) ? '<span class="new-tag mono">NEW</span>' : ''}
            <div class="meter">${[1, 2, 3, 4, 5].map((i) => `<div class="bar${i <= litBars(r.score) ? ' lit' : ''}"></div>`).join('')}</div>
            <span class="score-num mono">${r.score}%</span>
          </div>
        </div>
        <div class="evidence-line mono ${evidence}">${evidenceLabel(evidence)}</div>
        ${dateLine}
        ${renderTracksLine(r)}
        <div class="headline-row">
          <div class="headline" id="${id}">${escapeHtml(snippet)}</div>
          ${truncated ? `<button class="toggle-reason" data-target="${id}" aria-expanded="false" aria-label="show more">+</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderRevealSection(low, revealId) {
  if (!low.length) return '';
  return `
    <div class="reveal" id="${revealId}">
      <button class="reveal-toggle mono">${low.length} below ${HIGH_THRESHOLD}%</button>
      <div class="reveal-cards" hidden>
        ${low.map(renderCard).join('')}
      </div>
    </div>
  `;
}

function renderDateMode(releases) {
  const byDate = {};
  releases.forEach((r) => {
    (byDate[r.releaseDate] = byDate[r.releaseDate] || []).push(r);
  });
  const dates = Object.keys(byDate).sort();

  return dates.map((d) => {
    const sorted = [...byDate[d]].sort((a, b) => b.score - a.score);
    const high = sorted.filter((r) => r.score >= HIGH_THRESHOLD);
    const low = sorted.filter((r) => r.score < HIGH_THRESHOLD);
    const label = dayLabel(d);
    const revealId = 'reveal-' + d;
    const hideControl = low.length
      ? `<button class="hide-control mono" hidden>hide ${low.length}</button>`
      : '';

    return `
      <div class="day-group">
        <div class="datehead" data-reveal-id="${revealId}">
          <span class="label ${label.future ? 'future' : ''} mono">${label.text}</span>
          ${hideControl}
          <span class="rule"></span>
        </div>
        ${high.map(renderCard).join('')}
        ${renderRevealSection(low, revealId)}
      </div>
    `;
  }).join('');
}

function renderScoreMode(releases) {
  const sorted = [...releases].sort((a, b) => b.score - a.score);
  const high = sorted.filter((r) => r.score >= HIGH_THRESHOLD);
  const low = sorted.filter((r) => r.score < HIGH_THRESHOLD);
  const revealId = 'reveal-score';

  const pin = low.length
    ? `<div class="score-pin" hidden data-reveal-id="${revealId}"><button class="hide-control mono">hide ${low.length}</button></div>`
    : '';

  return `
    ${pin}
    ${high.map(renderCard).join('')}
    ${renderRevealSection(low, revealId)}
  `;
}

function renderReleasedDateMode(releases) {
  const byDate = {};
  releases.forEach((r) => {
    (byDate[r.releaseDate] = byDate[r.releaseDate] || []).push(r);
  });
  const dates = Object.keys(byDate).sort().reverse(); // newest already-out first

  return dates.map((d) => {
    const sorted = [...byDate[d]].sort((a, b) => b.score - a.score);
    const high = sorted.filter((r) => r.score >= HIGH_THRESHOLD);
    const low = sorted.filter((r) => r.score < HIGH_THRESHOLD);
    const revealId = 'reveal-rel-' + d;
    const hideControl = low.length
      ? `<button class="hide-control mono" hidden>hide ${low.length}</button>`
      : '';

    return `
      <div class="day-group">
        <div class="datehead" data-reveal-id="${revealId}">
          <span class="label mono">${shortDate(d)}</span>
          ${hideControl}
          <span class="rule"></span>
        </div>
        ${high.map(renderCard).join('')}
        ${renderRevealSection(low, revealId)}
      </div>
    `;
  }).join('');
}

function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 1);
  return Math.floor((d - start) / 86400000) + 1;
}

function stripDotSize(score) {
  const clamped = Math.max(HIGH_THRESHOLD, Math.min(100, score));
  if (clamped < STRIP_BRIGHT_THRESHOLD) {
    const t = (clamped - HIGH_THRESHOLD) / (STRIP_BRIGHT_THRESHOLD - HIGH_THRESHOLD);
    return 3 + t * 3; // regular band: 3-6px
  }
  const t = (clamped - STRIP_BRIGHT_THRESHOLD) / (100 - STRIP_BRIGHT_THRESHOLD);
  return 10 + t * 10; // bright band: 10-20px
}

function renderYearStrip(releases) {
  const strip = document.getElementById('yearstrip');
  if (!strip) return;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const year = today.getFullYear();
  const endOfYear = new Date(year, 11, 31);
  endOfYear.setHours(0, 0, 0, 0);
  const todayDoY = dayOfYear(today);
  const totalSpan = dayOfYear(endOfYear) - todayDoY;

  if (totalSpan <= 0) {
    strip.innerHTML = '';
    return;
  }

  const bestByDate = {};
  releases.forEach((r) => {
    if (typeof r.score !== 'number' || !r.releaseDate || r.score < HIGH_THRESHOLD) return;
    const d = new Date(r.releaseDate + 'T00:00:00');
    if (d < today || d > endOfYear) return;
    if (!bestByDate[r.releaseDate] || r.score > bestByDate[r.releaseDate]) {
      bestByDate[r.releaseDate] = r.score;
    }
  });

  let html = '<div class="track"></div><span class="mark now mono" style="left:0%;">NOW</span>';

  for (let m = today.getMonth() + 1; m <= 11; m++) {
    const monthStart = new Date(year, m, 1);
    const pct = ((dayOfYear(monthStart) - todayDoY) / totalSpan) * 100;
    if (pct <= 0 || pct >= 100) continue;
    const label = monthStart.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
    html += `<span class="mark mono" style="left:${pct.toFixed(2)}%;">${label}</span>`;
  }

  Object.keys(bestByDate).forEach((dateStr) => {
    const score = bestByDate[dateStr];
    const d = new Date(dateStr + 'T00:00:00');
    const pct = ((dayOfYear(d) - todayDoY) / totalSpan) * 100;
    const size = stripDotSize(score);
    const bright = score >= STRIP_BRIGHT_THRESHOLD;
    const delay = (Math.random() * 3.5).toFixed(2);
    html += `<div class="strip-blip${bright ? ' bright' : ''}" style="left:${pct.toFixed(2)}%; width:${size.toFixed(1)}px; height:${size.toFixed(1)}px; margin:-${(size / 2).toFixed(1)}px; --d:${delay}s;"></div>`;
  });

  strip.innerHTML = html;
}

function renderFeed() {
  cardCounter = 0;
  cardTextMap = {};
  const feed = document.getElementById('feed');

  if (view === 'released') {
    if (!allReleased.length) {
      feed.innerHTML = '<p class="empty mono">Nothing in already-out yet. The pipeline catches these automatically as release dates pass.</p>';
      return;
    }
    feed.innerHTML = mode === 'date' ? renderReleasedDateMode(allReleased) : renderScoreMode(allReleased);
    return;
  }

  const visible = visibleReleases();
  if (!allUpcoming.length) {
    feed.innerHTML = '<p class="empty mono">Nothing scored yet for what\'s ahead. The pipeline runs hourly, check back soon.</p>';
    return;
  }
  if (!visible.length) {
    feed.innerHTML = '<p class="empty mono">Nothing newly announced in the last ' + RECENT_DAYS + ' days. Turn off RECENT to see everything.</p>';
    return;
  }
  feed.innerHTML = mode === 'date' ? renderDateMode(visible) : renderScoreMode(visible);
}

function setView(next) {
  if (view === next) return;
  view = next;
  document.getElementById('view-upcoming').classList.toggle('active', view === 'upcoming');
  document.getElementById('view-released').classList.toggle('active', view === 'released');
  document.getElementById('view-upcoming').setAttribute('aria-pressed', String(view === 'upcoming'));
  document.getElementById('view-released').setAttribute('aria-pressed', String(view === 'released'));
  document.getElementById('yearstrip').style.display = view === 'upcoming' ? '' : 'none';
  document.getElementById('filter-recent').style.display = view === 'upcoming' ? '' : 'none';
  renderFeed();
}

function setMode(next) {
  if (mode === next) return;
  mode = next;
  document.getElementById('sort-date').classList.toggle('active', mode === 'date');
  document.getElementById('sort-score').classList.toggle('active', mode === 'score');
  document.getElementById('sort-date').setAttribute('aria-pressed', mode === 'date');
  document.getElementById('sort-score').setAttribute('aria-pressed', mode === 'score');
  renderFeed();
}

function expandReveal(reveal) {
  if (!reveal) return;
  const cards = reveal.querySelector('.reveal-cards');
  const trigger = reveal.querySelector('.reveal-toggle');
  cards.removeAttribute('hidden');
  trigger.setAttribute('hidden', '');
  const pinned = document.querySelector('[data-reveal-id="' + reveal.id + '"]');
  if (pinned) {
    pinned.removeAttribute('hidden');
    const hideCtl = pinned.querySelector('.hide-control');
    if (hideCtl) hideCtl.removeAttribute('hidden');
  }
}

function collapseReveal(reveal) {
  if (!reveal) return;
  const cards = reveal.querySelector('.reveal-cards');
  const trigger = reveal.querySelector('.reveal-toggle');
  cards.setAttribute('hidden', '');
  trigger.removeAttribute('hidden');
  const pinned = document.querySelector('[data-reveal-id="' + reveal.id + '"]');
  if (pinned) {
    const hideCtl = pinned.querySelector('.hide-control');
    if (hideCtl) hideCtl.setAttribute('hidden', '');
    if (pinned.classList.contains('score-pin')) pinned.setAttribute('hidden', '');
  }
  reveal.scrollIntoView({ block: 'start' });
}

function toggleRecentFilter() {
  recentOnly = !recentOnly;
  const btn = document.getElementById('filter-recent');
  btn.classList.toggle('active', recentOnly);
  btn.setAttribute('aria-pressed', String(recentOnly));
  renderFeed();
}

document.getElementById('sort-date').addEventListener('click', () => setMode('date'));
document.getElementById('sort-score').addEventListener('click', () => setMode('score'));
document.getElementById('filter-recent').addEventListener('click', toggleRecentFilter);
document.getElementById('view-upcoming').addEventListener('click', () => setView('upcoming'));
document.getElementById('view-released').addEventListener('click', () => setView('released'));

document.getElementById('feed').addEventListener('click', (e) => {
  const reasonBtn = e.target.closest('.toggle-reason');
  if (reasonBtn) {
    const id = reasonBtn.dataset.target;
    const textEl = document.getElementById(id);
    const stored = cardTextMap[id];
    if (textEl && stored) {
      const expanded = reasonBtn.getAttribute('aria-expanded') === 'true';
      textEl.textContent = expanded ? stored.snippet : stored.full;
      reasonBtn.textContent = expanded ? '+' : '\u2212';
      reasonBtn.setAttribute('aria-expanded', String(!expanded));
    }
    return;
  }

  const revealBtn = e.target.closest('.reveal-toggle');
  if (revealBtn) {
    expandReveal(revealBtn.closest('.reveal'));
    return;
  }

  const hideBtn = e.target.closest('.hide-control');
  if (hideBtn) {
    const owner = hideBtn.closest('[data-reveal-id]');
    if (owner) collapseReveal(document.getElementById(owner.dataset.revealId));
    return;
  }
});

async function load() {
  const feed = document.getElementById('feed');
  try {
    const res = await fetch('/.netlify/functions/releases');
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const todayStr = new Date().toISOString().slice(0, 10);
    const all = (data.releases || []).filter((r) => typeof r.score === 'number');
    allReleased = all.filter((r) => r.category === 'already-released');
    allUpcoming = all.filter((r) => r.category !== 'already-released' && r.releaseDate && r.releaseDate >= todayStr);

    renderYearStrip(allUpcoming);
    renderFeed();
  } catch (err) {
    feed.innerHTML = '<p class="error mono">Couldn\'t load the feed: ' + escapeHtml(err.message) + '</p>';
  }
}

load();

</script>
</body>
</html>
