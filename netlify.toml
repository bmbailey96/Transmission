[build]
  command = "echo no build step needed yet"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."scheduled-discovery"]
  schedule = "@hourly"

[functions."scheduled-already-released-move"]
  schedule = "@hourly"

# Was manual-only (a link on the site you had to remember to click), which
# is exactly how an album Wikipedia doesn't list until after it's already
# out falls through a real hole: the normal upcoming-pass only scores
# entries with releaseDate >= today, so anything first seen post-release
# was never reachable except through this. wikipedia-backlog-trigger just
# kicks off wikipedia-backlog-background (up to 40/run, 15-minute budget)
# and returns immediately, so scheduling the lightweight trigger here is
# the same pattern already used for the other two hourly jobs.
[functions."wikipedia-backlog-trigger"]
  schedule = "@hourly"

[functions."weekly-digest"]
  # 14:30 UTC = 8:30am Mountain Daylight Time. Netlify's scheduler runs on
  # fixed UTC, so this drifts to 7:30am local during Mountain Standard Time
  # (winter). See README note on DST if you want this corrected twice a year.
  schedule = "30 14 * * 1"