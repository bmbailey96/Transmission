[build]
  command = "echo no build step needed yet"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# V2 has one mutating writer. All legacy discovery/mover/backfill functions
# remain in the repo as rollback/reference tools but are intentionally unscheduled.
[functions."v2-engine-trigger"]
  schedule = "13 */3 * * *"

[functions."weekly-digest"]
  # 14:30 UTC = 8:30am MDT / 7:30am MST.
  schedule = "30 14 * * 1"
